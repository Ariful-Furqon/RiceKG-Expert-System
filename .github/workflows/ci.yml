name: RiceKG CI & Benchmark Evaluation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17 (Required for Pellet Reasoner)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automated pytest test suite
        run: |
          python -m pytest tests/ test.py -v

      - name: Run benchmark evaluation suite
        run: |
          python evaluate.py

      - name: Verify benchmark citations against Crossref API
        run: |
          python analysis/verify_citations.py

      - name: Run ablation study suite
        run: |
          python ablation.py

      - name: Run comparative baselines and significance tests
        run: |
          python baselines/run_baselines.py

      - name: Regenerate per-case field failure diagnosis
        run: |
          python analysis/field_failure_analysis.py

      - name: Execute ontology competency questions
        run: |
          python analysis/competency_questions.py

      - name: Verify documentation figures match results/
        run: |
          python analysis/check_readme_consistency.py

      - name: Upload regenerated results for reviewer inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-python-${{ matrix.python-version }}
          path: results/